services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # 直接构建镜像。Dockerfile 是「只负责运行」的镜像，要求事先编译好 Linux
    # 二进制（dist/<arch>/artex），所以先执行：
    #   docker compose up -d --build      （见 README「自行构建中文版镜像」一节）
    # 上游镜像 autumn27/artex 已随原作者关闭仓库而从 Docker Hub 下架
    # （pull 会报 not found），因此无法用 pull 启动。
    # 发布 CI 在打 v* 标签时会把多架构镜像发到 ghcr.io/dami9527/artex-cn，但这里默认
    # 仍走本地构建，不去拉任何预发布镜像。
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ARTEX_IMAGE:-artex-cn:local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # 必须与界面语言取同一个值。界面 locale 在静态导出时就被写进 HTML，服务端
      # 无从得知，所以服务端向数据库播种的显示名（reporter 等）的语言由这个运行时
      # 变量决定。build-image.sh 会把 locale 原样填进来。
      ARTEX_LOCALE: ${ARTEX_LOCALE:-zh}
      # 首次设置保护。留空时启动日志会打印一个随机设置令牌，需要在 /setup 页面填入该值
      # 才能创建管理员密码（用 docker compose logs artex 查看）。
      # 若给出 ARTEX_ADMIN_PASSWORD，则跳过 /setup，直接用该值初始化（至少 8 个字符）。
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # 浏览器跨源（CORS）白名单（逗号分隔）。内置 UI 是同源，通常保持为空。
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
      # 服务端默认输出语言（en、zh、es）。留空即简体中文。agent 输出与错误消息以设置页面的
      # 「显示语言」为准，服务端控制台日志只跟随这个值。
      ARTEX_LANG: ${ARTEX_LANG:-}
    ports:
      # 默认只发布到宿主机的 127.0.0.1。需要从其他设备直接访问时，在 .env 里设
      # ARTEX_BIND=0.0.0.0，但务必先完成首次设置（管理员密码），并尽量改用 README 里的
      # 反向代理（HTTPS）方案。
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 把数据目录绑定到项目根目录的 data/（sessions、tasks、traffic、transcripts），
      # 便于在宿主机直接查看与备份，重建容器也不会丢。
      # 注意：元数据（任务、漏洞、设置等）在 Postgres 的 pgdata 卷里，不在这里。
      - ./data:/app/data
      # 注意：JWT 签名密钥是 /app/jwt.key，**不在**上面的挂载里 —— 它必须留在可被
      # 文件管理器浏览的 data/ 之外，否则能读到工作区的人就能伪造登录令牌。
      # 代价是每次重建容器都会生成新的密钥，因此所有已登录会话失效，需要重新登录
      # 一次（管理员密码在 Postgres 里，不受影响）。若希望会话跨重建保留，可另加一条
      # 单文件挂载：先在宿主机把密钥取出来（该路径已被 .gitignore 忽略，免得提交密钥），
      # 再挂进容器 ——
      #   mkdir -p .secrets
      #   docker compose cp artex:/app/jwt.key .secrets/jwt.key
      #   - ./.secrets/jwt.key:/app/jwt.key
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）。
      # 改 skill 后无需重新构建镜像，容器直接读宿主机上的文件。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
