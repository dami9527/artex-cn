# pre-commit 配置示例（官方文档：https://pre-commit.com）
#
# 把仓库 CI 的两道确定性合并门禁提前到本地提交阶段跑一遍，让有问题的改动在推送前就被
# 拦下。任一钩子的断言失败都会以非 0 退出码结束，提交随之中止。
#
# 1) detections —— 只在提交改动了检测规则（detections/）或规则固定住的上游源码时，运行
#    一次性跑完八套检测测试的运行器（detections/tests/run-all.sh）。它与 CI
#    （.github/workflows/detections.yml）用同样的规则与源码范围，能抓住只改规则、没更新
#    测试与图层的改动。依赖 Docker（每套测试在容器里隔离执行，运行器上不装任何东西）。
# 2) docs —— 检查受跟踪的 Markdown 文档中仓库内部链接、图片、锚点（#标题）引用是否指向
#    真实存在的对象（scripts/check-doc-links.py）。与 CI（.github/workflows/docs.yml）同一
#    套检查；那边不带 paths 过滤、对所有改动都跑，这里也就不缩小目标文件范围（always_run）。
#    因为链接不只在改 .md 时会断，删掉或移动链接指向的文件（图片、LICENSE 等）时同样会断。
#    只用 Python 标准库、不访问网络，没有 Docker 也能在几十毫秒内跑完。
# 3) ko-check —— 扫描仓库中的文本文件（跳过构建产物与依赖目录），确认任何地方都不再有
#    韩文（谚文）残留（scripts/check-no-korean.py，与 .github/workflows/web.yml 里的门禁
#    同一个脚本）。界面、注释、用户可见文案、提示词、文档、脚本一律用简体中文，脚本发现
#    残留即以退出码 1 结束。只用 Python 标准库、不访问网络。
#
# 安装：        pip install pre-commit && pre-commit install
# 手动执行：    pre-commit run detections --all-files
#               pre-commit run docs --all-files
#               pre-commit run ko-check --all-files
#
# 这是只挂三个钩子的最小示例。想连 Go、前端的 lint 一起挂，在下面追加各自的钩子即可。
repos:
  - repo: local
    hooks:
      - id: detections
        name: 检测规则测试 8 套（Sigma·Suricata·ATT&CK·指标·MISP）
        entry: detections/tests/run-all.sh
        language: script
        pass_filenames: false
        files: '^(detections/|enrich/enrich\.go|selfupdate/(github|stage)\.go|guard/guard\.go|db/db\.go|db/schema\.sql|cmd/artex/main\.go|traffic/traffic\.go)'
      - id: docs
        name: 文档内部链接、图片、锚点（#标题）完整性检查
        entry: python3 -I scripts/check-doc-links.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ko-check
        name: 韩文残留检查（全仓库不允许韩文）
        entry: python3 -I scripts/check-no-korean.py
        language: system
        pass_filenames: false
        always_run: true
