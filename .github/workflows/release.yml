name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release 需要

jobs:
  # ① 前端静态导出（执行一次），产物给各平台交叉编译复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② 五平台交叉编译（内嵌前端）+ 打 zip
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 原始二进制单独上传，供 docker job 复用（免得在镜像里重编前端 + Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        # `--` 终止选项解析：文件名即使以 -（短横线）开头也不会被当成参数
        # （actionlint/shellcheck 的 SC2035 也就是冲着这一点提的）。
        run: sha256sum -- *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true

  # ④ 多架构镜像 → 推送到 GitHub Container Registry(ghcr.io)（复用 binaries 编好的 Linux
  #    二进制，镜像里只装工具 + 放二进制；arm64 只需模拟 apt 层，构建快得多）。
  #    登录用工作流自带的 GITHUB_TOKEN（job 权限 packages: write），不需要额外的机密。
  #    上游 autumn27/artex（Docker Hub）已下架，本仓库也没有它的推送权限，因此发布到本仓库
  #    自己的 ghcr 命名空间。
  docker:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # ⚠️ 发布命名空间（本仓库自己的）：ghcr.io/dami9527/artex-cn。
      #    首次发布后请在 GitHub 的 package 设置里确认它是 public，否则 docker compose pull
      #    会因认证失败而拉不到。若改回上游或其它 fork 的命名空间，下面的守卫步骤会在构建
      #    之前直接中止（那种情况下 login 会成功，但最后 push 会以 denied 失败）。
      IMAGE_NAMESPACE: ghcr.io/dami9527/artex-cn
    steps:
      # 命名空间若还是上游/其它 fork 的占位符，就在这里提前中止：那时 docker/login 会以本仓库
      # 身份成功，但 push 目标是别人的命名空间，只会在最后一步以 denied 迟而混乱地失败。
      # 这一步不挑选命名空间值，只拦住「还没改」的情况。
      - name: 检查发布命名空间是否仍是上游占位符（构建前中止）
        run: |
          case "${IMAGE_NAMESPACE}" in
            "")
              echo "::error::docker job 的 env.IMAGE_NAMESPACE 为空。请填本仓库自己的命名空间（例如 ghcr.io/dami9527/artex-cn）后重新打标签。"
              exit 1
              ;;
            autumn27/artex | jiwoochris/artex-ko | ghcr.io/jiwoochris/artex-ko)
              echo "::error::docker job 的 env.IMAGE_NAMESPACE 仍是上游或其它 fork 的命名空间 '${IMAGE_NAMESPACE}'。本仓库没有它的推送权限，发布会在 push 阶段以 denied 失败。请改成本仓库自己的命名空间（例如 ghcr.io/dami9527/artex-cn）后重新打标签。"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAMESPACE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
