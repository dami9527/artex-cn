name: external-links
# 检查受跟踪的 Markdown 所指向的外部链接（防御指南里的事件报告渠道 cert.org.cn、
# cac.gov.cn、12377.cn，CISA KEV，OWASP、SigmaHQ、Suricata、MITRE、MISP，原始演示，
# GitHub 徽章等）是否仍然存活。外部 URL 的存活依赖网络与远端服务器策略、容易
# flaky，因此不放进内部链接合并门禁（docs.yml）。所以本工作流不在推送与 PR 时跑，
# 只按每周计划与手动触发（workflow_dispatch）运行，**不阻塞合并**；外部链接一旦失效或
# 被关停，周期性运行会显红。内部链接与锚点由 docs.yml 负责，Go 构建、分析、测试由
# ci.yml 负责，检测规则由 detections.yml 负责，中文 UI 构建由 web.yml 负责。
#
# --strict 只在出现 allowlist（scripts/external-links-allowlist.txt）之外的 DOWN
# （404、410、5xx、DNS/连接错误）时才失败。RESTRICTED（机器人拦截、限速等，主机仍
# 存活）与 ALLOWED（我们无法修复的上游继承死链）不算失败，因此红灯的信号是
# 「我们文档精心维护的外部链接又断了 —— 去看看」。计划工作流只在默认分支（main）上跑。
on:
  schedule:
    - cron: "17 0 * * 1" # 每周一 00:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # python3 是 ubuntu-latest runner 自带的，脚本又只用标准库，因此无需额外安装。
      # 用 -I 隔离用户 site 与环境后执行。
      - name: 外部链接存活检查（浏览器 UA、GET、跟随重定向 · 排除 allowlist · 不阻塞合并）
        run: python3 -I scripts/check-external-links.py --strict
