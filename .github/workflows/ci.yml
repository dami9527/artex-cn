name: ci
# 每次推送与 PR 都跑构建、静态分析与测试，在合并前抓住本地化过程中引入的回归。
# 发布工作流（release.yml）只在标签（v*）上运行，且只做构建与发布，
# 因此日常变更的验证由本工作流负责。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # 韩文残留门禁。`web.yml` 里那一步只在该工作流触发时运行，而它带 `paths: web/**`
  # 过滤，所以韩文写进 Go 源码、文档或脚本时那边不会跑。本工作流不带 paths 过滤、
  # 每次推送与 PR 都跑，因此把同一个脚本（`scripts/check-no-korean.py`）也挂在这里，
  # 让全仓库的韩文门禁与改动落在哪个目录无关。只用 Python 标准库，不联网。
  ko-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 韩文残留检查（全仓库不允许韩文）
        run: python3 -I scripts/check-no-korean.py

  # 在没有数据库的情况下跑构建、静态分析与测试，原样复现贡献者 clone 仓库后
  # 不带 PostgreSQL 跑 `go test ./...` 的环境。必须有数据库才能跑的集成测试在该环境下
  # 用 t.Skipf 跳过（跳过按通过计入），因此构建、go vet 与不依赖 DB 的单元测试必须
  # 全绿。即便只有这一组合，也能在合并前抓住跨包边界的回归（例如改了某个包的文案、
  # 却弄坏另一个包测试断言的情况）。
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test（无 DB — 集成测试跳过）
        run: go test ./... -count=1

  # 负责必须要有真实 PostgreSQL 才能跑的数据库集成测试（通知、证据、用量计量等）。
  # 它用真实数据库强制跑上面 go job 跳过的路径（通知渠道校验、证据保存、llm_usage
  # 计量等），把只在 DB 集成路径上暴露的本地化回归也拦在合并前。
  #
  # 上游的测试台架让所有包共用一个数据库、只建一次表后复用，并隐式依赖包的执行顺序
  # 与累积数据，因此把全部包压进一个数据库去跑会以各种方式崩掉（累积数据污染、
  # 连接 teardown 竞争、重置时的跨包 schema 依赖）。所以这里为每个包各起一套
  # PostgreSQL 服务，按「空数据库 + 单个包」隔离运行。每个包作为独立 job（matrix）
  # 运行，彼此碰不到对方的数据、连接与 schema，上述三种冲突在结构上就不存在了。
  # db.Open 会自动迁移 schema；像 llm_usage 这种 db.Open 不建的表，由各测试自己用
  # EnsureLLMUsageTable 保证。
  go-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [agent, config, db, evidence, llmrec, server]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artex -d artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: go test（DB 集成 · ${{ matrix.pkg }} 包隔离）
        env:
          ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
        run: go test ./${{ matrix.pkg }}/ -count=1
