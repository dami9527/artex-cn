name: detections
# 每当改动检测规则（Sigma、Suricata、ATT&CK 图层）的推送与 PR，都用可复现测试验证这
# 些规则确实会触发、能转换到多种 SIEM 后端、覆盖率图层与规则一致、指标仍与上游源码
# 吻合，并通过 SigmaHQ 惯例的全量校验。只改规则、没更新测试与图层的改动会在这里显红。
# 本工作流把 CONTRIBUTING.md 与 detections/tests/README.md 所承诺的「八套测试机械地
# 强制贡献契约」真正落成合并门禁。Go 构建、静态分析与测试由 ci.yml 负责。
# 除八套测试外，还有两道非规则门禁在同一个合并门禁里跑：台架注册表同步检查，以及
# 主机分类工具（detections/triage/artex_host_triage.py）的自检。两者都与八套规则测试
# 无关，由 run-all.sh 一并运行。
#
# 八套测试只要有 Docker 就能跑（ubuntu-latest runner 自带 Docker）。runner 会拉取
# sigma-cli、scapy、suricata、python 镜像并在容器里隔离执行，因此 runner 本身不装
# 任何东西，规则树与指标指向的源文件只以只读方式挂载，不写入仓库。除 detections/ 下
# 有改动时之外，指标测试固定住的源文件变化时也会跑。enrich、selfupdate、guard、db 的
# User-Agent、标记与破坏性命令 token，cmd/artex/main.go 的默认监听与代理端口，
# traffic/traffic.go 的 MITM CA 证书文件名，db/schema.sql 的探索图 schema 指纹都属于
# 这一类。源码改动带着指标一起变、规则与指标清单悄悄过时的情况，在这里被合并门禁拦下。
# 因匿名拉取公开 Docker 镜像，偶尔会撞上 Docker Hub 拉取限速，此时重跑任务即可恢复。
on:
  push:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - ".github/workflows/detections.yml"
  pull_request:
    paths:
      - "detections/**"
      - "enrich/enrich.go"
      - "selfupdate/github.go"
      - "selfupdate/stage.go"
      - "guard/guard.go"
      - "db/db.go"
      - "db/schema.sql"
      - "cmd/artex/main.go"
      - "traffic/traffic.go"
      - ".github/workflows/detections.yml"

permissions:
  contents: read

# 同一分支有新的推送时取消先前的运行，避免频繁推送期间堆积无谓的执行。
concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 测试台架注册表同步检查（run-all.sh ↔ CI ↔ 目录）
        run: detections/tests/check-harness-sync.sh
      - name: 主机分类工具自检（artex_host_triage.py --self-test · 非规则门禁）
        run: detections/tests/triage-selftest.sh
      - name: Sigma 规则可复现测试（sigma check + 后端转换 + 指标保全）
        run: detections/tests/sigma/run.sh
      - name: Sigma 真实事件匹配测试（原子规则与关联规则：对恶意样本/时间线触发，对正常样本静默）
        run: detections/tests/sigma_match/run.sh
      - name: Sigma SigmaHQ 惯例校验（全量校验器 + 已记录基准）
        run: detections/tests/sigma_lint/run.sh
      - name: Sigma 后端可移植性测试（关联规则能否在多个后端转换）
        run: detections/tests/sigma_backends/run.sh
      - name: Suricata 规则可复现测试（合成 pcap → suricata -r → 断言告警数）
        run: detections/tests/suricata/run.sh
      - name: ATT&CK 图层 ↔ 规则一致性测试
        run: detections/tests/attack/run.sh
      - name: 检测指标 ↔ 上游源码一致性测试（上游重新同步的漂移守卫）
        run: detections/tests/indicators/run.sh
      - name: 指标 MISP 导出 ↔ CSV 同步测试（用 pymisp 校验 MISP 格式合法性）
        run: detections/tests/misp/run.sh
