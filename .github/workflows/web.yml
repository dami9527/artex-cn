name: web
# 每次推送与 PR 都跑中文 UI（web/）的静态导出构建，在合并前抓住前端回归。发布工作流
# （release.yml）只在标签（v*）上构建 web，而本 fork 没有标签推送记录，因此它一次也没
# 运行过 —— 所以日常 web 改动（TypeScript、React、i18n、next-intl）的验证由本工作流
# 负责。Go 侧的构建与测试由 ci.yml 负责，因此这里只在 web/ 有改动时运行（paths 过滤）。
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # 静态导出构建是合并门禁。`NEXT_EXPORT=1 next build` 因为 next.config 里没有
  # typescript.ignoreBuildErrors 设置，会一并做 TypeScript 类型检查，所以一旦出现类型
  # 错误或导出失败，本 job 就会显红并拦住合并。
  #
  # biome lint 同样是合并门禁。把上游带过来的既有 lint 欠账（G7）清零之后
  # （错误 8→0：skills 树 a11y 6 项 + package.json 格式化 1 项 + logo.svg noSvgWithoutTitle 1 项），
  # 就把信息性步骤提升成了门禁。现在 `npm run check`（biome check）一报错，本 job 就
  # 显红拦住合并，防止已经干净的状态再被弄脏。警告与提示不影响退出码
  # （biome 只在 error 级别返回非 0），因此不阻塞合并。
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: build:static（合并门禁 · 含类型检查）
        run: npm run build:static
      - name: 韩文残留检查（合并门禁 · 全仓库不再有韩文）
        # 本仓库的界面、注释、用户可见文案、提示词、文档与脚本一律使用简体中文，
        # 任何地方混进韩文（谚文）都算回归。脚本按自身位置推算仓库根目录，扫描范围
        # 不受工作目录影响；这里显式回到仓库根目录执行，避开 job 级的
        # working-directory: web。发现残留时脚本以退出码 1 结束，从而拦住合并。
        working-directory: .
        run: python3 -I scripts/check-no-korean.py
      - name: biome check（合并门禁 · lint、format、a11y 保持 0 错误）
        if: always()
        run: npm run check
