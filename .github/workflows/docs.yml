name: docs
# 每次推送与 PR 都检查受跟踪的 Markdown 文档里仓库内部链接、图片引用是否指向真实存在
# 的文件，以及文档锚点链接（#标题）是否指向目标文档中确实存在的标题，阻止断链、断图与
# 断锚点被合并。链接指向的文件可能在仓库任何位置（例如 ../LICENSE、screenshots/zh/*.png），
# 因此不带 paths 过滤、对所有改动都跑。外部 URL（http/https/mailto）依赖网络、容易
# flaky，不予检查 —— scripts/check-doc-links.py 只看内部引用。
# 只用 Python 标准库、不访问网络，结果是确定性的，不会被 Docker Hub 限速这类外部因素
# 搞得时红时绿。Go 构建、静态分析与测试由 ci.yml 负责，检测规则可复现测试由
# detections.yml 负责，中文 UI 构建由 web.yml 负责。
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# 同一分支有新的推送时取消先前的运行，避免堆积无谓的执行。
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # python3 是 ubuntu-latest runner 自带的，脚本又只用标准库，因此不需要额外的
      # 安装步骤。用 -I 隔离用户 site 与环境后执行。
      - name: 文档内部链接、图片、锚点完整性检查
        run: python3 -I scripts/check-doc-links.py
