name: 💡 功能建议
description: 提出新功能或改进想法。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出想法。把下面各项填好，便于对齐方向。
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认
      options:
        - label: 我已搜索过是否已有类似建议。
          required: true
        - label: 本建议不鼓励超出授权使用范围或违反中国法律法规的用法。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 起因是什么问题或需求
      description: 请先写清要解决的场景。了解问题比了解方案更重要。
      placeholder: "例如：把检测结果分享给团队时，希望报告能导出成 PDF。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 请写出你认为合适的解决方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果想过别的办法，请一并写出。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关领域
      options:
        - 智能体 (agent)
        - Web UI / 服务端 (web / server)
        - LLM 供应商接入
        - 文档·翻译
        - 其他
    validations:
      required: false
