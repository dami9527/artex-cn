name: 🐛 缺陷报告
description: 报告与预期不符或报错的问题。
title: "[缺陷] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。把下面各项填好，复现和修复都会更快。
        **安全漏洞请不要走本模板，请按 [SECURITY.md](https://github.com/dami9527/artex-cn/security/policy) 的非公开流程报告。**
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认
      options:
        - label: 我已搜索过是否已有类似议题。
          required: true
        - label: 这个问题是在自己所有或已获授权的目标、或本地隔离环境中复现的。
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 请一并写明预期行为与实际行为。
      placeholder: "例如：检测结果本应是简体中文，却输出成了英文。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请按顺序写出能重新制造该问题的步骤。
      placeholder: |
        1. 进入 '...' 界面
        2. 执行 '...'
        3. 在 '...' 处报错
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志·截图
      description: 请附上相关日志或截图。敏感值（API 密钥、令牌、目标地址）请先遮挡。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: 涉及范围
      description: 请选择出问题的组成部件。
      options:
        - 智能体 (agent)
        - Web UI / 服务端 (web / server)
        - 安装·部署 (Docker·脚本)
        - LLM 供应商接入
        - 文档·翻译
        - 说不清
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 请写明发布标签或提交哈希。
      placeholder: "例如：v2.2.0 或 b45ba04"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 请写明操作系统、是否使用 Docker、LLM 模型等。
      placeholder: "例如：macOS 15 / Docker Compose / claude-opus-4-8"
    validations:
      required: false
