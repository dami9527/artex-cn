name: 🌐 翻译·本地化错误
description: 报告中文措辞生硬、翻译错误或翻译缺失的问题。
title: "[翻译] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助提升中文版的质量。
        本仓库的本地化方针是：**只把面向用户的产出统一为简体中文，智能体的内部推理提示词以及命令、payload、代码、日志原文一律保持原样。**
        详细原则见 [CONTRIBUTING.md](https://github.com/dami9527/artex-cn/blob/main/CONTRIBUTING.md#本地化方针)。
  - type: dropdown
    id: kind
    attributes:
      label: 属于哪类问题
      options:
        - 措辞生硬或不自然
        - 翻译错误（含义不同）
        - 翻译缺失（仍显示英文等原文）
        - 不该翻译的内容被翻译了（命令、代码、日志等）
        - 术语需要统一
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 在哪里看到的
      options:
        - Web UI
        - 智能体产出（检测结果·摘要·报告·对话回复）
        - 文档（README 等）
        - 其他
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 当前文案
      description: 请把现在看到的文案原样贴出来，并写明是哪个界面、什么情况下出现的。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议文案
      description: 请提出你建议的改法。（可选）
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: 消息键 / 文件位置
      description: 知道才填。例如 web/messages/zh.json 里的键，或文件路径。
      placeholder: "例如：web/messages/zh.json → dashboard.title"
    validations:
      required: false
